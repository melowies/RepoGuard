version: 1
applications:
  - appRoot: repo-guard
    frontend:
      phases:
        build:
          commands:
            - echo "Preparing static RepoGuard AWS deployment"
            - "sed -i 's#</body>#  <script src=\"js/deploy-english.js\"></script>\\n  <script src=\"js/deploy-fixes.js\"></script>\\n</body>#' index.html"
      artifacts:
        baseDirectory: .
        files:
          - "**/*"
