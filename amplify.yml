version: 1
applications:
  - appRoot: repo-guard
    frontend:
      phases:
        build:
          commands:
            - echo "Preparing original RepoGuard UI for AWS Amplify"
            - "sed -i 's#<script src=\"js/app.js\" defer></script>#<script src=\"js/app.js\" defer></script>\\n  <script src=\"js/aws-runtime.js\" defer></script>#' index.html"
      artifacts:
        baseDirectory: .
        files:
          - "**/*"
